<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24130D" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="50%" stop-color="#F4C95D" />
      <stop offset="100%" stop-color="#D49319" />
    </linearGradient>
    <linearGradient id="pinkMane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9ACB" />
      <stop offset="60%" stop-color="#F45AA8" />
      <stop offset="100%" stop-color="#BD1A70" />
    </linearGradient>
    <linearGradient id="softMane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4DE" />
      <stop offset="100%" stop-color="#FFCBE2" />
    </linearGradient>
    <linearGradient id="goldHorn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="40%" stop-color="#F4C95D" />
      <stop offset="100%" stop-color="#D49319" />
    </linearGradient>
  </defs>

  <!-- Deep Chocolate Background with Gold Trim -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#F4C95D" stroke-width="4" stroke-opacity="0.4" />

  <!-- Centered Unicorn Artwork (Scale & position for 512x512) -->
  <g transform="translate(68, 56) scale(3.8)">
    <!-- Sparkles -->
    <polygon points="18,12 20,7 22,12 27,14 22,16 20,21 18,16 13,14" fill="#F4C95D" />
    <polygon points="85,32 86,29 87,32 90,33 87,34 86,37 85,34 82,33" fill="#FFF4DE" opacity="0.8" />
    <circle cx="82" cy="18" r="1.5" fill="#FF9ACB" />

    <!-- Horn -->
    <polygon points="32,22 47,4 39,26" fill="url(#goldHorn)" stroke="#050505" stroke-width="0.8" />
    <line x1="36" y1="20" x2="42" y2="12" stroke="#FFF8D6" stroke-width="1.2" stroke-linecap="round" />

    <!-- Crown -->
    <polygon points="31,24 25,17 34,20 41,13 42,22 49,19 44,27" fill="url(#goldCrown)" stroke="#7A4E08" stroke-width="0.8" />
    <circle cx="25" cy="17" r="1.5" fill="#FFFFFF" />
    <circle cx="41" cy="13" r="1.8" fill="#FFFFFF" />
    <circle cx="49" cy="19" r="1.5" fill="#FFFFFF" />

    <!-- Flowing Mane Outer -->
    <path d="M26,38 C20,44 14,56 16,68 C18,78 26,86 32,92 C24,84 22,72 26,62 C29,55 35,52 35,46 Z" fill="url(#pinkMane)" />

    <!-- Flowing Mane Inner -->
    <path d="M34,42 C28,50 24,62 26,72 C28,80 34,88 38,91 C32,82 31,70 34,60 C37,52 42,48 40,42 Z" fill="url(#softMane)" />

    <!-- Head -->
    <path d="M38,28 C42,28 47,32 52,36 C58,41 68,44 72,48 C74,51 75,55 72,58 C68,61 63,59 58,55 C53,62 48,72 44,80 C40,88 36,92 34,92 C36,86 42,75 46,65 C48,59 47,54 44,48 C42,44 38,40 36,36 C35,32 36,29 38,28 Z" fill="#FFFFFF" stroke="#24130D" stroke-width="1" />

    <!-- Ear -->
    <path d="M36,26 C36,21 39,20 42,24 C41,27 39,29 36,26 Z" fill="#FFFFFF" stroke="#24130D" stroke-width="0.8" />
    <path d="M37,25 C37,23 39,22 40,24 Z" fill="#FF9ACB" />

    <!-- Sweet eye & rosy cheek -->
    <path d="M56,42 Q60,46 63,43" stroke="#24130D" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <circle cx="56" cy="49" r="3.5" fill="#FF9ACB" opacity="0.6" />

    <!-- Heart -->
    <path d="M45,70 C43,67 39,67 39,71 C39,75 45,79 45,79 C45,79 51,75 51,71 C51,67 47,67 45,70 Z" fill="url(#goldCrown)" />
  </g>
</svg>
